<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ビルドカード生成機</title>

    <link rel="icon" type="image/png" href="/assets/img/shicoku.png" />
    <link rel="shortcut icon" type="image/png" href="/assets/img/shicoku.png" />
    <link rel="apple-touch-icon" href="/assets/img/shicoku.png" />

    <!--styles-->
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/page/home.css" />
  </head>
  <body>
    <div id="header"></div>
    <p class="title">ビルドカード生成機</p>
    <div class="uidBox">
      <form id="form">
        <input id="uid" type="text" placeholder="UIDを入力" />
        <button id="btn" type="button" onclick="getData()"><span class="search"></span></button>
      </form>

      <div id="countdownCircle" class="circle-wrapper">
        <svg viewBox="0 0 100 100" width="100" height="100">
          <circle class="bg" cx="50" cy="50" r="45" />
          <circle class="fg" cx="50" cy="50" r="45" />
        </svg>
        <span class="count-text">30</span>
      </div>
    </div>

    <div id="char"></div>

    <div id="card-btn">
      <div class="reload card-btn">
        <a type="button" onclick="reload()">
          <div>
            <svg width="100" height="100" viewBox="0 0 100 100">
              <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0.2" refY="3.5" orient="auto">
                  <polygon points="-2 0, 2 3.5, -2 7" fill="#55ddff" />
                </marker>
              </defs>

              <path d="M50,70 A30,30 0 1,1 70,30" fill="none" stroke="#55ddff" stroke-width="10" marker-end="url(#arrowhead)" />
            </svg>
            <span>リロード</span>
          </div>
        </a>
      </div>

      <div class="download card-btn">
        <a type="button" onclick="downloadCard()">
          <svg width="24" height="24" viewBox="0 0 24 24" stroke="#55ddff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="15" />
            <polyline points="6 11 12 17 18 11" />
            <line x1="5" y1="19" x2="19" y2="19" />
          </svg>
          <span>ダウンロード</span>
        </a>
      </div>
    </div>

    <div><canvas id="card" width="1920" height="1080"></canvas></div>
    <div id="card-img"></div>
    <div id="log"></div>

    <div id="status"></div>

    <div id="loader">
      <div class="spinner-box">
        <div class="spinner"></div>
        <div><progress id="progress" value="0" max="100"></progress></div>
      </div>
    </div>

    <script type="module" src="/dist/index.js"></script>
    <script>
      const input = document.getElementById("uid");
      input.value = localStorage.getItem("uid") || "";
      input.addEventListener("input", () => {
        localStorage.setItem("uid", input.value);
      });
    </script>

    <script>
      const header = document.getElementById("header");
      fetch("/assets/includes/header.html")
        .then((res) => res.text())
        .then((html) => {
          header.innerHTML = html;

          const page = location.pathname.split("/");
          const links = header.querySelectorAll("a[data-page]");
          links.forEach((link) => {
            if (link.getAttribute("data-page") === page[0]) {
              link.classList.add("here");
            }
          });
        });
    </script>
  </body>
</html>
